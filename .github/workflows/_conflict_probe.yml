name: _conflict_probe
on:
  push:
    branches:
      - fix/dev-upstream-conflicts-20260912
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract per-file conflict hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alibaba/open-code-review.git
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            rm -rf CONFLICTS
            mkdir CONFLICTS
            files=$(git diff --name-only --diff-filter=U)
            for f in $files; do
              out="CONFLICTS/$(basename "$f").txt"
              {
                echo "===== $f ====="
                grep -n -B20 -A80 '^<<<<<<<\|^=======$\|^>>>>>>> ' "$f" || true
              } > "$out"
            done
            git merge --abort
            git add CONFLICTS
            git commit -m "chore: capture per-file upstream conflict hunks"
            git push origin HEAD
          else
            echo NO_CONFLICTS > CONFLICTS.txt
            git merge --abort
            git add CONFLICTS.txt
            git commit -m "chore: record no conflicts"
            git push origin HEAD
          fi
