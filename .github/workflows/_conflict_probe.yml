name: _conflict_probe
on:
  push:
    branches:
      - fix/dev-upstream-conflicts-20260912
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract conflict hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alibaba/open-code-review.git
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git checkout --conflict=diff3 -- $(git diff --name-only --diff-filter=U)
            : > CONFLICT_HUNKS.txt
            for f in $(git diff --name-only --diff-filter=U); do
              printf '\n===== %s =====\n' "$f" >> CONFLICT_HUNKS.txt
              grep -n -B25 -A25 '^<<<<<<<\|^=======$\|^>>>>>>> ' "$f" >> CONFLICT_HUNKS.txt || true
            done
            git merge --abort
          else
            echo "NO CONFLICTS" > CONFLICT_HUNKS.txt
            git merge --abort
          fi
          git add CONFLICT_HUNKS.txt
          git commit -m "chore: capture upstream conflict hunks"
          git push origin HEAD
