name: _resolve_upstream
on:
  push:
    branches:
      - fix/upstream-merge-20260912-work
permissions:
  contents: read
  issues: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alibaba/open-code-review.git
          git fetch upstream main
          git merge --no-edit --no-ff upstream/main
          go test ./...
      - name: Publish merge commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MERGE_SHA=$(git rev-parse HEAD)
          gh api repos/tk1cntt/open-code-review/issues/2/comments \
            -f body="Verified upstream merge commit: ${MERGE_SHA}"
