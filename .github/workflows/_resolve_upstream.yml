name: _resolve_upstream
on:
  push:
    branches:
      - fix/upstream-merge-20260912-work
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alibaba/open-code-review.git
          git fetch upstream main
          git merge --no-edit --no-ff upstream/main
          git push origin HEAD
      - name: Test
        run: go test ./...
      - name: Cleanup helper
        run: |
          rm .github/workflows/_resolve_upstream.yml
          git add -A
          git commit -m "chore: remove temporary upstream merge helper"
          git push origin HEAD